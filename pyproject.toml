[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samambaia"
version = "0.1.0"
description = "Cooperative local AI agent coordinator combining Google Antigravity SDK, Ollama, and Open WebUI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.0.0",
    "fastapi>=0.115.0",
    "google-antigravity",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
samambaia = "samambaia.cli:main"
aaaia = "samambaia.cli:main"
samambaia-daemon = "samambaia.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/samambaia"]
